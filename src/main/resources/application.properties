# ============================================================
#  UrbanStep - configuracion principal
# ============================================================
spring.application.name=tienda-ropa
server.port=8080

# ---------- Vistas JSP ----------
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ---------- MySQL local ----------
# XAMPP / MySQL Workbench: crea primero la base con basedatos/01_esquema.sql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_ropa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_CLAVE:}
# Si en tu XAMPP usas el usuario "estudiantes", cambia las dos lineas de arriba:
# spring.datasource.username=estudiantes
# spring.datasource.password=TU_CLAVE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Cifrado de datos privados y sensibles (AES-256-GCM) ----------
# CAMBIA esta frase en produccion y guardala como variable de entorno.
app.cifrado.clave=${CLAVE_CIFRADO:urbanstep-clave-local-2026}

# ---------- Chatbot ----------
# Motor de reglas: siempre activo (funciona sin internet).
# IA opcional (Google Gemini, capa gratuita) para preguntas fuera de las reglas.
# El chatbot siempre responde con el motor de reglas. La IA es una capa
# adicional, opcional, para lo que las reglas no cubren.
app.chatbot.ia-habilitada=false

# Proveedor de IA: "gemini" (nube, necesita llave) u "ollama" (local, sin llave)
app.chatbot.proveedor=gemini

# --- Opcion A: Google Gemini (llave gratis en aistudio.google.com) ---
app.chatbot.gemini-api-key=${GEMINI_API_KEY:}
app.chatbot.gemini-modelo=gemini-2.0-flash

# --- Opcion B: Ollama corriendo en tu propio PC, sin internet ---
#     Instala Ollama, ejecuta:  ollama pull llama3.2:3b
#     y pon arriba: app.chatbot.ia-habilitada=true y proveedor=ollama
app.chatbot.ollama-url=http://localhost:11434
app.chatbot.ollama-modelo=llama3.2:3b

# ---------- Pasarela de pagos (Wompi) ----------
# Las llaves se sacan del comercio en https://comercios.wompi.co
# En sandbox empiezan por pub_test_ y prv_test_; en produccion por pub_prod_.
#
# IMPORTANTE: la llave PRIVADA y los secretos NUNCA van en el navegador ni en
# un repositorio publico. En produccion se pasan como variables de entorno.
# habilitado=true activa el boton de pago en linea.
app.pago.wompi.habilitado=true

# modo=simulado  -> pasarela local, sin cuenta ni RUT ni internet. Sirve para
#                   desarrollar y para demostrar el flujo completo.
# modo=real      -> checkout de Wompi. Requiere las llaves de abajo.
app.pago.wompi.modo=simulado

app.pago.wompi.llave-publica=${WOMPI_LLAVE_PUBLICA:}
app.pago.wompi.llave-integridad=${WOMPI_LLAVE_INTEGRIDAD:}
app.pago.wompi.llave-eventos=${WOMPI_LLAVE_EVENTOS:}

# Sandbox (pruebas). Para produccion: https://production.wompi.co/v1
app.pago.wompi.url-api=https://sandbox.wompi.co/v1
app.pago.wompi.url-checkout=https://checkout.wompi.co/p/
app.pago.wompi.url-retorno=${WOMPI_URL_RETORNO:http://localhost:8080/pagos/wompi/retorno}
app.pago.wompi.moneda=COP

# ---------- Imagenes de producto ----------
# Carpeta del disco donde se guardan las imagenes que sube el administrador.
# Va FUERA del proyecto a proposito: si estuviera dentro del war, cada
# despliegue borraria lo subido. Cambia la ruta si prefieres otra.
app.imagenes.carpeta=${user.home}/tienda-ropa-imagenes

# Limites de subida de archivos (8 MB: una foto de celular pesa eso facil,
# ahora que el cliente sube comprobantes y fotos de entrega)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Datos de demostracion ----------
# true = carga catalogo, usuarios y 3 meses de atenciones simuladas la primera vez
app.datos-demo=true

# ---------- Politica de tratamiento ----------
app.politica.version=v1.0-2026
app.empresa.nombre=UrbanStep

# ---------- Log ----------
logging.level.org.springframework.security=INFO
logging.level.com.tiendaropa=INFO
