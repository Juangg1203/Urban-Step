# ============================================================
# UrbanStep - Configuracion principal
# ============================================================

spring.application.name=tienda-ropa

server.port=${PORT:8080}


# ============================================================
# Vistas JSP
# ============================================================

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


# ============================================================
# Base de datos MySQL
# ============================================================
#
# LOCAL:
# Si no existe DB_URL, utiliza MySQL de XAMPP:
#
# jdbc:mysql://localhost:3306/tienda_ropa
#
# PRODUCCION:
# En Render debes crear las variables:
#
# DB_URL
# DB_USUARIO
# DB_CLAVE
#
# ============================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_ropa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}

spring.datasource.username=${DB_USUARIO:root}

spring.datasource.password=${DB_CLAVE:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# Dialecto MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ============================================================
# Cifrado de datos privados y sensibles
# AES-256-GCM
# ============================================================

# En produccion cambiar esta clave mediante variable de entorno.
app.cifrado.clave=${CLAVE_CIFRADO:urbanstep-clave-local-2026}


# ============================================================
# Chatbot
# ============================================================

# Motor de reglas siempre activo.
# La IA es opcional.

app.chatbot.ia-habilitada=false

# Proveedor:
# gemini
# ollama

app.chatbot.proveedor=gemini


# ============================================================
# Google Gemini
# ============================================================

app.chatbot.gemini-api-key=${GEMINI_API_KEY:}

app.chatbot.gemini-modelo=gemini-2.0-flash


# ============================================================
# Ollama
# ============================================================

app.chatbot.ollama-url=http://localhost:11434

app.chatbot.ollama-modelo=llama3.2:3b


# ============================================================
# Pasarela de pagos - Wompi
# ============================================================

# true = habilita el sistema de pagos
app.pago.wompi.habilitado=true

# Modos:
# simulado = desarrollo / demostracion
# real = Wompi
app.pago.wompi.modo=simulado


# Llaves de Wompi
# NUNCA colocar las llaves reales directamente en GitHub.

app.pago.wompi.llave-publica=${WOMPI_LLAVE_PUBLICA:}

app.pago.wompi.llave-integridad=${WOMPI_LLAVE_INTEGRIDAD:}

app.pago.wompi.llave-eventos=${WOMPI_LLAVE_EVENTOS:}


# ============================================================
# URLs Wompi
# ============================================================

app.pago.wompi.url-api=${WOMPI_URL_API:https://sandbox.wompi.co/v1}

app.pago.wompi.url-checkout=${WOMPI_URL_CHECKOUT:https://checkout.wompi.co/p/}

# LOCAL:
# http://localhost:8080/pagos/wompi/retorno
#
# PRODUCCION:
# En Render configurar WOMPI_URL_RETORNO

app.pago.wompi.url-retorno=${WOMPI_URL_RETORNO:http://localhost:8080/pagos/wompi/retorno}

app.pago.wompi.moneda=COP


# ============================================================
# Imagenes de productos
# ============================================================

# Local:
# Se almacenan en la carpeta del usuario.

# Produccion:
# Lo ideal es utilizar almacenamiento externo
# como Cloudinary, S3, Supabase Storage, etc.

app.imagenes.carpeta=${IMAGENES_CARPETA:${user.home}/tienda-ropa-imagenes}


# ============================================================
# Limites de subida de archivos
# ============================================================

spring.servlet.multipart.max-file-size=8MB

spring.servlet.multipart.max-request-size=10MB


# ============================================================
# Datos de demostracion
# ============================================================

# true = carga datos de prueba
# false = no carga datos de demostracion

app.datos-demo=true


# ============================================================
# Politica de tratamiento de datos
# ============================================================

app.politica.version=v1.0-2026

app.empresa.nombre=UrbanStep


# ============================================================
# Logs
# ============================================================

logging.level.org.springframework.security=INFO

logging.level.com.tiendaropa=INFO